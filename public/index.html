<script src="fullscreen.js"></script>
<script>
(() => {
  const OWN_SCRIPT = document.currentScript ? document.currentScript.textContent : null; // see "a newer page" below
  const API = '/plugins/signalk-czone';
  const SK = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/signalk/v1/stream?subscribe=none`;
  const categoryIcons = {
    'House/Habitat':'🏠', 'Vessel Critical':'🛟', Navigation:'🧭', Electronics:'📟', '24-Hour Circuits':'🕘',
    Communications:'📡', Accessories:'🔧', 'Indicators and Alarms':'🚨', 'Engine Management':'⚙️',
    'Fans/Ventilation':'🌀', Lighting:'💡', 'Vessel Management':'🚢', Pumps:'💧', 'Propulsion Management':'🚤',
    Power:'⚡', Refrigeration:'❄️', Entertainment:'🎵', Climate:'🌡️', Appliances:'🔌', Other:'•••',
    'User Definable 1':'①', 'User Definable 2':'②', 'User Definable 3':'③', 'User Definable 4':'④',
    'User Definable 5':'⑤', 'Bilge Pumps':'🌊'
  };
  const categoryColors = {
    'House/Habitat':'#7bb8ff', 'Vessel Critical':'#ff6576', Navigation:'#54c7ff', Electronics:'#35b7ff',
    '24-Hour Circuits':'#8ea0b6', Communications:'#58c7e8', Accessories:'#d2a85a', 'Indicators and Alarms':'#ff6576',
    'Engine Management':'#b58cff', 'Fans/Ventilation':'#3ee0c5', Lighting:'#ffc34d', 'Vessel Management':'#55b6d9',
    Pumps:'#27d7d5', 'Propulsion Management':'#b877ff', Power:'#b877ff', Refrigeration:'#6cc8ff',
    Entertainment:'#ee66d9', Climate:'#6cc8ff', Appliances:'#ff9f58', Other:'#8ea0b6',
    'User Definable 1':'#8ea0b6', 'User Definable 2':'#8ea0b6', 'User Definable 3':'#8ea0b6',
    'User Definable 4':'#8ea0b6', 'User Definable 5':'#8ea0b6', 'Bilge Pumps':'#27d7d5'
  };
  // Canonical CZone sub-category order from signalk-czone-zcf. AC, DC and Favorites
  // are top-level filters, so they do not appear again in the category list.
  const canonicalCategories = [
    'House/Habitat', 'Vessel Critical', 'Navigation', 'Electronics', '24-Hour Circuits',
    'Communications', 'Accessories', 'Indicators and Alarms', 'Engine Management',
    'Fans/Ventilation', 'Lighting', 'Vessel Management', 'Pumps', 'Propulsion Management',
    'Power', 'Refrigeration', 'Entertainment', 'Climate', 'Appliances', 'Other',
    'User Definable 1', 'User Definable 2', 'User Definable 3', 'User Definable 4',
    'User Definable 5', 'Bilge Pumps'
  ];
  const topLevelCategories = new Set(['AC', 'DC', 'Favorites']);
  // On a Navico chartplotter (see the .mfd styles). The plotter adds
  // mfd_name, mfd_model_detail, brand, lang and mode to the address.
  // signalk-navico-embedder, the proxy that puts Signal K webapps on those
  // plotters, also leaves window.SK_TOKEN on the page; either sign will do.
  const MFD = /[?&](mfd_name|mfd_model_detail|brand|layout=mfd)\b/.test(location.search) || typeof window.SK_TOKEN === 'string';
  if (MFD) document.documentElement.classList.add('mfd');
  // Drawn icons for the plotter, whose fonts lack most of the symbol
  // characters the desktop page uses (they show as empty boxes there).
  const MFD_ICONS = {
    home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>', dot:'<circle cx="12" cy="12" r="5" fill="currentColor"/>',
    star:'<path d="M12 3l2.8 6 6.2.6-4.7 4.2 1.5 6.2L12 16.6 6.2 20l1.5-6.2L3 9.6 9.2 9z"/>',
    ac:'<path d="M2 12c2.5-9 6-9 8.5 0s6 9 8.5 0"/><path d="M21 12h1"/>', battery:'<rect x="3" y="7" width="16" height="10" rx="2"/><path d="M22 10v4"/>',
    gauge:'<path d="M4 18a9 9 0 1 1 16 0"/><path d="M12 14l4-6"/>', bolt:'<path d="M13 2L5 14h6l-1 8 8-12h-6z"/>',
    bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5V15h8v-1.5A6 6 0 0 0 12 3z"/>',
    compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>', drop:'<path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/>',
    music:'<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>',
    fan:'<circle cx="12" cy="12" r="2"/><path d="M12 10c-1-4 1-7 4-7 1 3-1 6-4 7zM13.7 13c4-1 7 1 7 4-3 1-6-1-7-4zM10.3 13c-1 4-4 6-7 5 0-3 3-5 7-5z"/>',
    chip:'<rect x="7" y="7" width="10" height="10" rx="1"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/>',
    snow:'<path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/>', phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
    warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.500"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', plus:'<path d="M12 5v14M5 12h14"/>',
    gear:'<circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/>',
    anchor:'<circle cx="12" cy="5" r="2"/><path d="M12 7v14M5 13a7 7 0 0 0 14 0M9 10h6"/>', sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
    swap:'<path d="M4 9h15l-3-3M20 15H5l3 3"/>', tank:'<rect x="5" y="6" width="14" height="14" rx="2"/><path d="M5 13h14M9 6V3h6v3"/>',
    temp:'<path d="M12 3a2 2 0 0 0-2 2v9a4 4 0 1 0 4 0V5a2 2 0 0 0-2-2z"/>', cloud:'<path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1A4.5 4.5 0 0 1 17 18z"/>',
    toggle:'<rect x="3" y="8" width="18" height="8" rx="4"/><circle cx="8" cy="12" r="2"/>', house:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
    appliance:'<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="14" r="4"/><path d="M8 6h2"/>'
  };
  const MFD_ICON_FOR = { all:'home', inuse:'dot', favorites:'star', ac:'ac', dc:'battery', monitor:'gauge',
    Lighting:'bulb', Navigation:'compass', Pumps:'drop', 'Bilge Pumps':'drop', Power:'bolt', Entertainment:'music', 'Fans/Ventilation':'fan', Electronics:'chip', Climate:'snow', Refrigeration:'snow',
    Communications:'phone', 'Vessel Critical':'warn', 'Indicators and Alarms':'warn', '24-Hour Circuits':'clock', Accessories:'plus', 'Engine Management':'gear', 'Vessel Management':'gear',
    'Propulsion Management':'fan', 'House/Habitat':'house', Appliances:'appliance', 'Deck Equipment':'anchor',
    Batteries:'battery', Solar:'sun', Alternators:'gear', Converters:'swap', 'Wind Generators':'fan', 'AC Power':'ac', Tanks:'tank', Temperatures:'temp', Environment:'cloud', 'Circuit current':'bolt', Inputs:'toggle' };
  const mfdIcon = key => `<svg class="ico" viewBox="0 0 24 24">${MFD_ICONS[MFD_ICON_FOR[key]] || MFD_ICONS.dot}</svg>`;
  // The Monitoring tab's data (GET /monitoring/live).
  let monitor = { items: [], temperatures: {}, trendsEnabled: false };
  let circuits = [], status = {}, modes = [], activeMode = null, vesselName = '', view = 'all', category = null, query = '', sort = 'name', socket = null;
  let socketReconnectTimer = null, watchdogTimer = null, lastSocketUpdateAt = 0, socketConnected = false, socketEverOpen = false;
  const WS_WATCHDOG_MS = 120000;
  const COMMAND_CONFIRM_MS = 15000;
  const COMMAND_RECONCILE_DELAY_MS = 200;
  const COMMAND_RECONCILE_INTERVAL_MS = 250;
  const COMMAND_RECONCILE_ATTEMPTS = 12;
  const pending = new Map();
  let modePending = null;
  const favoritesKey = 'signalk-czone-circuits:favorites';
  let favorites = new Set(JSON.parse(localStorage.getItem(favoritesKey) || '[]'));

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const nameKey = c => c.slug || c.name;
  const stateOf = c => c.state && c.state.state === 'ON';
  const percentOf = c => c.state && Number.isFinite(c.state.percent) ? c.state.percent : null;
  const currentOf = c => c.state && Number.isFinite(c.state.current) ? c.state.current : null;
  const currentLabel = c => {
    const current = currentOf(c);
    return current != null && current > 0 ? `${current.toFixed(1)} A` : null;
  };
  const categoryData = c => c.categories || { master: [], sub: [], userDefined: [] };
  const allCategories = c => [...(categoryData(c).master || []), ...(categoryData(c).sub || []), ...(categoryData(c).userDefined || [])];
  const catList = () => {
    const assigned = new Set(circuits.flatMap(allCategories).filter(c => !topLevelCategories.has(c)));
    const canonical = canonicalCategories.filter(c => assigned.has(c));
    const unknown = [...assigned].filter(c => !canonicalCategories.includes(c)).sort((a,b) => a.localeCompare(b));
    return [...canonical, ...unknown].sort((a, b) => a.localeCompare(b));
  };
  const countCat = cat => circuits.filter(c => allCategories(c).includes(cat)).length;
  const activeCount = () => circuits.filter(stateOf).length;
  const masterCount = m => circuits.filter(c => (categoryData(c).master || []).includes(m)).length;
  const subCategoryList = c => [...new Set([...(categoryData(c).sub || []), ...(categoryData(c).userDefined || [])])];
  const icon = c => MFD ? mfdIcon(c) : (categoryIcons[c] || '•');
  const color = c => categoryColors[c] || '#4bb5ff';

  function saveFavorites() { localStorage.setItem(favoritesKey, JSON.stringify([...favorites])); }
  function setView(v) { view=v; category=null; render(); if (v === 'monitor') { monitorLastFetch = 0; refreshMonitoring(); } }
  function setCategory(c) { category=c; view='category'; render(); }
  window.setView = setView; window.setCategory = setCategory;

  function renderNav() {
    const items = [
      ['all','⌂','All Circuits',circuits.length], ['inuse','●','In Use',activeCount()], ['favorites','☆','Favorites',circuits.filter(c=>favorites.has(nameKey(c))).length],
      ['ac','♆','AC',masterCount('AC')], ['dc','▣','DC',masterCount('DC')]
    ];
    if (monitor.items.length) items.push(['monitor','◔','Monitoring',monitor.items.length]);
    document.querySelector('#mainNav').innerHTML = items.map(([v,i,t,n]) => `<button class="${view===v && !category?'active':''}" onclick="setView('${v}')"><span class="nav-icon">${MFD ? mfdIcon(v) : i}</span>${t}<span class="nav-count">${n}</span></button>`).join('');
  }

  function renderCategories() {
    const cats = catList();
    const el = document.querySelector('#categoryNav');
    if (!el) return;
    el.innerHTML = cats.map(c => `<button class="category-card ${category===c?'active':''}" style="--cat:${color(c)}" onclick="setCategory('${esc(c).replace(/'/g,"\\'")}')"><div class="cat-icon">${icon(c)}</div><div><strong>${esc(c)}</strong><span>${countCat(c)} circuits</span></div></button>`).join('');
  }

  function currentList() {
    let list = circuits.filter(c => {
      if (c.showInCircuitList === false) return false;
      if (view==='inuse' && !stateOf(c)) return false;
      if (view==='favorites' && !favorites.has(nameKey(c))) return false;
      if (view==='ac' && !(categoryData(c).master || []).includes('AC')) return false;
      if (view==='dc' && !(categoryData(c).master || []).includes('DC')) return false;
      if (category && !allCategories(c).includes(category)) return false;
      if (query && !(`${c.name} ${allCategories(c).join(' ')}`.toLowerCase().includes(query.toLowerCase()))) return false;
      return true;
    });
    list.sort((a,b) => sort==='state' ? Number(stateOf(b))-Number(stateOf(a)) || a.name.localeCompare(b.name) : sort==='brightness' ? (percentOf(b)||0)-(percentOf(a)||0) || a.name.localeCompare(b.name) : a.name.localeCompare(b.name));
    return list;
  }

  function renderCircuits() {
    if (view === 'monitor' && !category) { renderMonitoring(); return; }
    const list = currentList();
    const title = category || ({all:'All Circuits',inuse:'In Use',favorites:'Favorites',ac:'AC Circuits',dc:'DC Circuits',search:'Search Results'}[view] || 'Circuits');
    document.querySelector('#sectionTitle').textContent = title;
    document.querySelector('#sectionCount').textContent = `${list.length} circuit${list.length===1?'':'s'}`;
    document.querySelector('#sectionIcon').textContent = MFD ? '' : category ? icon(category) : view==='favorites' ? '☆' : view==='inuse' ? '●' : '⚡';
    document.querySelector('#circuits').innerHTML = list.length ? list.map(circuitRow).join('') : `<div class="empty">No circuits match this view.</div>`;
  }

  // A temperature paired with the circuit by name ("Freezer" and "Freezer
  // Temperature"), from the Monitoring data. Opens its trend when trends are on.
  function tempChip(c) {
    const t = monitor.temperatures[c.slug];
    if (!t || !Number.isFinite(t.kelvin)) return '';
    const text = `${(t.kelvin - 273.15).toFixed(1)}°C`;
    return monitor.trendsEnabled
      ? `<button type="button" class="temp-chip" title="${esc(t.name)} trend" onclick="event.stopPropagation();openSeries('${encodeURIComponent(t.path)}','${encodeURIComponent(t.name)}','temperature')">${text}</button>`
      : `<span class="temp-chip" title="${esc(t.name)}">${text}</span>`;
  }

  const MONITOR_GROUPS = ['Batteries','Solar','Alternators','Converters','Wind Generators','DC','AC Power','Tanks','Temperatures','Environment','Inputs'];
  window.openSeries = (path, name, field) => {
    path = decodeURIComponent(path);
    const item = monitor.items.find(i => i.readings.some(r => r.path === path));
    showTrend({ path, title: decodeURIComponent(name), r: readingFor(item, field) });
  };

  function monitorValue(item, r) {
    const u = readingFor(item, r.field);
    const box = `<b>${u.f(r.value).toFixed(u.dp)}</b><i>${u.unit}</i><small>${u.label}</small>`;
    return monitor.trendsEnabled && r.field !== 'capacity'
      ? `<button type="button" class="mon-val" title="${u.label} trend" onclick="openSeries('${encodeURIComponent(r.path)}','${encodeURIComponent(item.name)}','${r.field}')">${box}</button>`
      : `<div class="mon-val">${box}</div>`;
  }

  function monitorRow(item) {
    let values = '', sub;
    if (item.kind === 'input') {
      values = item.state === null ? '' : `<div class="mon-val ${item.state ? 'on' : ''}"><b>${item.state ? 'ON' : 'OFF'}</b><small>Switch input</small></div>`;
      sub = item.decoded === false ? 'This kind of module is not read yet' : item.live ? (item.since ? `Since ${new Date(item.since).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })}` : 'Switch input') : 'No status from its module yet';
    } else {
      values = item.live ? item.readings.map(r => monitorValue(item, r)).join('') : '';
      if (item.live && item.capacity) values += `<div class="mon-val"><b>${Math.round(item.capacity * 1000)}</b><i>L</i><small>Capacity</small></div>`;
      sub = item.live ? `Instance ${item.instance}${item.thirdParty ? ' · third-party' : ''}` : `Nothing is sending instance ${item.instance} on NMEA 2000`;
    }
    return `<div class="mon-row ${item.live ? '' : 'off'}"><div class="circuit-name"><strong>${esc(item.name)}</strong><small>${esc(sub)}</small></div><div class="mon-values">${values}</div><span class="mon-live">${item.live ? 'LIVE' : 'NOT ON BUS'}</span></div>`;
  }

  function renderMonitoring() {
    const live = monitor.items.filter(i => i.live).length;
    document.querySelector('#sectionTitle').textContent = 'Monitoring';
    document.querySelector('#sectionCount').textContent = `${monitor.items.length} item${monitor.items.length === 1 ? '' : 's'} · ${live} live`;
    document.querySelector('#sectionIcon').textContent = MFD ? '' : '◔';
    const groups = MONITOR_GROUPS.concat(monitor.items.map(i => i.group).filter(g => MONITOR_GROUPS.indexOf(g) < 0));
    const q = query.toLowerCase();
    let html = '';
    for (const g of groups) {
      const rows = monitor.items.filter(i => i.group === g && (!q || `${i.name} ${g}`.toLowerCase().includes(q)));
      if (rows.length) html += `<div class="mon-group">${esc(g)}</div>` + rows.map(monitorRow).join('');
    }
    document.querySelector('#circuits').innerHTML = html || '<div class="empty">Nothing to monitor in this configuration.</div>';
  }

  // Every 5 s on the Monitoring tab, every 30 s elsewhere (temperature chips).
  let monitorLastFetch = 0;
  async function refreshMonitoring() {
    const now = Date.now();
    if (view !== 'monitor' && now - monitorLastFetch < 30000) return;
    monitorLastFetch = now;
    try {
      const r = await fetch(`${API}/monitoring/live`, { cache:'no-store', credentials:'include' });
      if (!r.ok) return;
      const data = await r.json();
      const chips = () => JSON.stringify(Object.keys(monitor.temperatures).map(k => [k, monitor.temperatures[k].kelvin.toFixed(1)]).concat([monitor.items.length, monitor.trendsEnabled]));
      const before = chips();
      monitor = { items: Array.isArray(data.items) ? data.items : [], temperatures: data.temperatures || {}, trendsEnabled: data.trendsEnabled === true };
      if (view === 'monitor' && !category) { renderMonitoring(); renderNav(); }
      else if (chips() !== before) render(); // only when a chip or the tab changed: a redraw would cut short a slider being moved
    } catch (_) { /* the next round tries again */ }
  }

  const LOCK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  // A padlock after the name of a circuit set to confirm before turning on or off.
  function askMark(c) {
    if (!c.confirmOn && !c.confirmOff) return '';
    const actions = c.confirmOn && c.confirmOff ? 'turning on or off' : (c.confirmOn ? 'turning on' : 'turning off');
    return `<span class="ask-mark" title="Asks before ${actions}">${LOCK_SVG}</span>`;
  }

  function circuitRow(c) {
    const on = stateOf(c), pct = percentOf(c), current = currentLabel(c), dim = !!(c.capabilities && c.capabilities.dimmer), fav = favorites.has(nameKey(c));
    const p = pending.get(nameKey(c));
    const cats = subCategoryList(c).slice(0,3).map(x => `<span class="tag cat" role="img" tabindex="0" style="--cat:${color(x)}" title="${esc(x)}" aria-label="${esc(x)} category">${icon(x)}</span>`).join('');
    const disabled = p && p.kind === 'state';
    const toggle = `<button type="button" class="toggle ${on?'on':'off'} ${disabled?'pending':''}" data-circuit-slug="${esc(c.slug)}" ${disabled?'disabled':''} aria-busy="${disabled?'true':'false'}" aria-label="Turn ${on?'off':'on'} ${esc(c.name)}" onclick="toggleCircuit('${encodeURIComponent(c.name)}',${!on})">${disabled?'Sending…':(on && current ? current : (on?'ON':'OFF'))}</button>`;
    const control = dim ? `<div class="control"><div class="range-wrap"><input aria-label="${esc(c.name)} brightness" type="range" min="1" max="100" value="${Math.max(1,Math.round(pct == null ? 100 : pct))}" oninput="previewPercent(this)" onchange="setLevel('${encodeURIComponent(c.name)}',this.value)"><span class="percent">${pct == null ? '—' : Math.round(pct)+'%'}</span></div>${toggle}</div>` : `<div class="control">${toggle}</div>`;
    const sending = p ? `<span class="sending">Sending…</span>` : '';
    return `<div class="circuit"><button class="fav ${fav?'on':''}" title="${fav?'Remove from':'Add to'} favorites" onclick="toggleFavorite('${esc(nameKey(c)).replace(/'/g,"\\'")}')">${fav?'★':'☆'}</button><div class="circuit-name"><strong>${esc(c.name)}${askMark(c)}${tempChip(c)}</strong><small>${esc((categoryData(c).master || [])[0] || 'CZone')} · module ${Number(c.module).toString(16).padStart(2,'0').toUpperCase()} / ch ${c.channel}</small></div><div class="tags"><span class="tag">${esc(c.masterCategory || 'CZone')}</span>${cats}</div><div><div class="status ${on?'on':''}"><span class="status-dot"></span>${on?'ON':'OFF'} ${sending}</div>${control}</div>${status.trendsEnabled === true ? `<button type="button" class="arrow" title="Current trend" aria-label="Current trend for ${esc(c.name)}" onclick="openTrend('${encodeURIComponent(c.slug)}')">›</button>` : '<span class="arrow">›</span>'}</div>`;
  }

  function previewPercent(el) { const out=el.parentElement.querySelector('.percent'); out.textContent=el.value+'%'; }
  window.previewPercent = previewPercent;

  function circuitBySlug(slug) { return circuits.find(c => c.slug === slug); }
  function setPending(c, kind, requested, previous) {
    const key = nameKey(c);
    const timer = setTimeout(() => {
      const p = pending.get(key);
      if (!p || p.timer !== timer) return;
      console.debug('[CZone UI] command confirmation timeout', c.name, requested);
      pending.delete(key);
      refreshOnce('command-timeout');
      render();
    }, COMMAND_CONFIRM_MS);
    pending.set(key, { kind, requested, previous, timer, reconcileTimer: null, reconcileAttempts: 0 });
  }

  function stopPendingTimers(p) {
    if (!p) return;
    clearTimeout(p.timer);
    if (p.reconcileTimer) clearTimeout(p.reconcileTimer);
  }

  async function reconcilePendingState(c) {
    const key = nameKey(c);
    const p = pending.get(key);
    if (!p || p.kind !== 'state') return;
    if (p.reconcileAttempts >= COMMAND_RECONCILE_ATTEMPTS) {
      console.debug('[CZone UI] REST reconciliation exhausted', c.name, p.requested);
      return;
    }
    p.reconcileAttempts += 1;
    try {
      const r = await fetch(`${API}/circuits/${encodeURIComponent(c.name)}/state`, { cache:'no-store', credentials:'include' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      const observed = data.state && data.state.state;
      console.debug('[CZone UI] REST reconciliation', c.name, 'observed=', observed, 'requested=', p.requested, 'attempt=', p.reconcileAttempts);
      if (observed === p.requested) {
        c.state = c.state || {};
        c.state.state = observed;
        clearPending(c, 'state', observed);
        render();
        return;
      }
    } catch (err) {
      console.debug('[CZone UI] REST reconciliation error', c.name, err.message);
    }
    const current = pending.get(key);
    if (!current || current !== p) return;
    current.reconcileTimer = setTimeout(() => { reconcilePendingState(c); }, COMMAND_RECONCILE_INTERVAL_MS);
  }

  function startPendingReconciliation(c, kind) {
    if (kind !== 'state') return;
    const p = pending.get(nameKey(c));
    if (!p) return;
    p.reconcileTimer = setTimeout(() => { reconcilePendingState(c); }, COMMAND_RECONCILE_DELAY_MS);
  }
  function clearPending(c, kind, observed) {
    const key = nameKey(c), p = pending.get(key);
    if (!p || p.kind !== kind) return;
    const confirmed = kind === 'state' ? observed === p.requested : Math.round(observed) === Math.round(p.requested);
    stopPendingTimers(p);
    if (!confirmed) {
      // CZone disagreed with the optimistic request. The observed WebSocket
      // value is authoritative, so keep it and stop showing Sending.
      if (kind === 'state') c.state.state = observed;
      else c.state.percent = observed;
    }
    pending.delete(key);
  }
  function rollbackPending(c, kind) {
    const key = nameKey(c), p = pending.get(key);
    if (!p || p.kind !== kind) return;
    stopPendingTimers(p);
    if (kind === 'state') c.state.state = p.previous;
    else c.state.percent = p.previous;
    pending.delete(key);
  }
  function applySocketValue(path, value, source, timestamp) {
    if (path === 'electrical.czone.settingsRevision') {
      console.debug('[CZone WS] settings changed; refreshing circuit nominations', value);
      refreshOnce('settings-change');
      return false;
    }
    if (path === 'name') {
      const nextName = typeof value === 'string' ? value.trim() : '';
      if (nextName && nextName !== vesselName) { vesselName = nextName; renderHero(); return true; }
      return false;
    }
    if (path === 'electrical.czone.mode.active') {
      const mode = modes.find(m => m.slug === value || m.name === value);
      console.debug('[CZone WS] MODE', value, 'matched=', !!mode, 'source=', source ? JSON.stringify(source) : 'none', 'timestamp=', timestamp || 'none');
      if (mode) {
        activeMode = mode;
        if (modePending && modePending.slug === mode.slug) modePending = null;
        else if (modePending) { modePending = null; }
        return true;
      }
      return false;
    }
    const m = /^electrical\.czone\.([^\.]+)\.(switch\.(?:state|brightness)|current)$/.exec(path || '');
    if (!m) return false;
    const c = circuitBySlug(m[1]);
    if (!c) { console.debug('[CZone WS] unmatched circuit path', path, value); return false; }
    c.state = c.state || {};
    const sourceLabel = source && (source.label || source.type || source.src) ? JSON.stringify(source) : 'none';
    if (m[2] === 'current') {
      const observed = Number(value);
      if (!Number.isFinite(observed)) { console.debug('[CZone WS] invalid current', c.name, value); return false; }
      c.state.current = observed;
      // Current is high-frequency telemetry. Store every observation, but update
      // only the existing control instead of rebuilding the whole navigation and
      // circuit list for every packet.
      const toggle = document.querySelector(`[data-circuit-slug="${CSS.escape(c.slug)}"]`);
      const p = pending.get(nameKey(c));
      if (toggle && !(p && p.kind === 'state')) {
        toggle.textContent = c.state.state === 'ON' && observed > 0 ? `${observed.toFixed(1)} A` : (c.state.state === 'ON' ? 'ON' : 'OFF');
      }
      return false;
    }
    if (m[2] === 'switch.state') {
      const observed = value === true || value === 1 || value === 'ON' || value === 'on';
      const observedState = observed ? 'ON' : 'OFF';
      const p = pending.get(nameKey(c));
      console.debug('[CZone WS] STATE', c.name, observedState, 'raw=', value, 'source=', sourceLabel, 'timestamp=', timestamp || 'none', p ? `pending=${p.requested}` : 'pending=none');
      // A command is optimistic until CZone confirms it. Do not let a stale
      // conflicting WebSocket value immediately undo the user's click.
      if (p && p.kind === 'state' && observedState !== p.requested) {
        console.debug('[CZone WS] STATE ignored while pending', c.name, 'observed=', observedState, 'requested=', p.requested);
        return true;
      }
      c.state.state = observedState;
      const wasPending = !!p;
      clearPending(c, 'state', observedState);
      if (wasPending) console.debug('[CZone UI] STATE CONFIRMED via WebSocket', c.name, observedState);
    } else {
      const observed = Math.round(Number(value) * 100);
      if (!Number.isFinite(observed)) { console.debug('[CZone WS] invalid brightness', c.name, value); return false; }
      console.debug('[CZone WS] BRIGHTNESS', c.name, observed + '%', 'raw=', value);
      c.state.percent = observed;
      clearPending(c, 'brightness', observed);
    }
    return true;
  }

  function mergeRest(data) {
    const incoming = data.circuits || [];
    if (!circuits.length) circuits = incoming;
    else {
      const bySlug = new Map(incoming.map(c => [c.slug, c]));
      circuits = circuits.map(c => {
        const fresh = bySlug.get(c.slug);
        if (!fresh) return c;
        const p = pending.get(nameKey(c));
        // REST snapshots may omit current; retain live telemetry while merging
        // authoritative state/brightness. An explicit zero must still replace it.
        return { ...fresh, state: p ? c.state : { ...(c.state || {}), ...(fresh.state || {}) } };
      });
    }
    status = data;
    if (Array.isArray(data.modes)) modes = data.modes;
    if (data.activeMode) activeMode = data.activeMode;
  }
  function showLoadError(message, signIn) {
    const el = document.querySelector('#loadError');
    // Keep a sign-in form that is already showing: someone may be typing in it.
    if (signIn && !el.hidden && el.loginForm) return;
    el.loginForm = null;
    el.textContent = message + ' ';
    if (signIn) el.appendChild(loginForm(el));
    const link = document.createElement('a');
    link.style.color = 'var(--cyan)';
    if (signIn) {
      const here = window.location.pathname + window.location.search + window.location.hash;
      link.href = '/admin/#/login?redirect=' + encodeURIComponent(here);
      link.textContent = 'Or sign in on the Signal K login page';
    } else {
      link.href = window.location.href;
      link.textContent = 'Retry';
      link.onclick = event => { event.preventDefault(); window.location.reload(); };
    }
    el.appendChild(link);
    el.hidden = false;
  }

  // Sign in on the page itself. A home-screen app (iPad, Android) keeps its
  // own login, separate from the browser's, and has no address bar; the link
  // to the admin page stays as the alternative. "Remember me" keeps the login
  // after the app is closed, for as long as Signal K's token lasts.
  function loginForm(banner) {
    const form = document.createElement('form');
    form.className = 'login-form';
    const field = (name, type, autocomplete, placeholder) => {
      const input = document.createElement('input');
      input.name = name; input.type = type; input.required = true;
      input.autocomplete = autocomplete; input.placeholder = placeholder;
      form.appendChild(input);
      return input;
    };
    const user = field('username', 'text', 'username', 'Signal K user');
    const pass = field('password', 'password', 'current-password', 'Password');
    const button = document.createElement('button');
    button.type = 'submit'; button.textContent = 'Log in';
    form.appendChild(button);
    const error = document.createElement('span');
    error.className = 'login-error';
    form.appendChild(error);
    form.onsubmit = async event => {
      event.preventDefault();
      error.textContent = '';
      button.disabled = true;
      try {
        const r = await fetch('/signalk/v1/auth/login', { method:'POST', credentials:'include', headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ username: user.value, password: pass.value, rememberMe: true }) });
        if (r.ok) { window.location.reload(); return; }
        error.textContent = r.status === 401 ? 'Wrong user name or password.' : 'Signal K refused the login (HTTP ' + r.status + ').';
      } catch (_) {
        error.textContent = 'Signal K could not be reached.';
      }
      button.disabled = false;
    };
    banner.loginForm = form;
    return form;
  }

  async function showCircuitRequestError(response) {
    let signIn = response.status === 401;
    if (response.status === 403) {
      try {
        const r = await fetch('/skServer/loginStatus', { cache:'no-store', credentials:'include' });
        if (r.ok) signIn = (await r.json()).status === 'notLoggedIn';
      } catch (_) { /* Keep the permission error if login status cannot be checked. */ }
    }
    const message = signIn
      ? 'Sign in to Signal K to load CZone circuits.'
      : response.status === 403
        ? 'Signal K denied access to CZone circuits. Your account may not have the required permissions.'
        : 'Could not load CZone circuits (HTTP ' + response.status + '). Check the Signal K server and CZone plugin.';
    showLoadError(message, signIn);
    // The plotter hides the banner, and its login is the Navico embedder's token.
    updateSocketIndicator(signIn ? (MFD ? 'Sign in required: set the token in the Navico embedder' : 'Sign in required') : 'Unable to load CZone circuits', false);
  }

  async function refreshOnce(reason = 'manual') {
    try {
      const r = await fetch(`${API}/circuits`, { cache:'no-store', credentials:'include' });
      if (!r.ok) { await showCircuitRequestError(r); return false; }
      const data = await r.json();
      const incoming = Array.isArray(data.circuits) ? data.circuits : [];
      console.debug('[CZone UI] REST refresh', reason, { circuits: incoming.length, modes: Array.isArray(data.modes) ? data.modes.length : 0, sendingEnabled: data.sendingEnabled === true, nmeaReady: data.nmeaReady === true });
      mergeRest(data);
      if (incoming.length === 0) throw new Error('CZone plugin returned an empty circuit list');
      // "Connected" only while the live feed is up. This read is a one-off
      // (first load, or the watchdog's reconciliation): with the feed down
      // the page would otherwise say Connected while nothing on it moves.
      const conn = document.querySelector('#connection');
      conn.classList.toggle('ok', socketConnected);
      conn.innerHTML = socketConnected
        ? '<i></i><span>Connected · live circuit data</span>'
        : socketEverOpen
          ? `<i></i><span>Live updates lost · reconnecting… (circuits as of ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })})</span>`
          : '<i></i><span>Circuits loaded · connecting live updates…</span>';
      document.querySelector('#loadError').hidden = true;
      render();
      return true;
    } catch (e) {
      console.warn('[CZone UI] REST refresh failed', reason, e);
      document.querySelector('#connection').classList.remove('ok');
      showLoadError('Could not load CZone circuits. Check the Signal K connection and CZone plugin. ' + e.message, false);
      updateSocketIndicator('Unable to load CZone circuits', false);
      return false;
    }
  }

  async function refreshVesselName() {
    try {
      const r = await fetch('/signalk/v1/api/vessels/self/name', { cache:'no-store', credentials:'include' });
      if (!r.ok) return;
      const data = await r.json();
      const nextName = typeof data === 'string' ? data.trim() : (typeof data.value === 'string' ? data.value.trim() : '');
      if (nextName) { vesselName = nextName; renderHero(); }
    } catch (_) {}
  }

  function signalKPath(circuit, leaf) {
    return `/signalk/v1/api/vessels/self/electrical/czone/${encodeURIComponent(circuit.slug)}/switch/${leaf}`;
  }

  async function putSignalK(path, value, circuit, kind, requested, previous) {
    setPending(circuit, kind, requested, previous);
    render();
    try {
      const r = await fetch(path, {
        method: 'PUT',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ value })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.message || data.error || `PUT failed (HTTP ${r.status})`);
      // The PUT is a request, not an observed-state update. CZone telemetry
      // remains authoritative and confirms the command through the WebSocket.
      // Keep the existing REST reconciliation only as a fallback if the browser
      // misses that confirmation; it never writes the requested value back.
      console.debug('[CZone UI] Signal K PUT accepted', circuit.name, kind, requested, data);
      startPendingReconciliation(circuit, kind);
      render();
    } catch (e) {
      rollbackPending(circuit, kind);
      render();
      alert(e.message);
    }
  }

  // Confirm before switching: a question and two buttons, nothing else. Our own
  // dialog, not window.confirm, which some embedded browsers do not show.
  // The confirming button is dead for the first half second, so a double tap
  // on the switch cannot answer the question.
  let closeAsk = null;
  function askSwitch(c, on) {
    return new Promise(resolve => {
      if (closeAsk) closeAsk(false);
      const action = on ? 'Turn on' : 'Turn off';
      const cancel = on ? 'Keep off' : 'Keep on';
      const el = document.createElement('div');
      el.className = 'ask';
      el.innerHTML = `<div class="ask-box" role="alertdialog" aria-modal="true" aria-labelledby="askTitle"><h3 id="askTitle">${action} ${esc(c.name.trim())}?</h3><div class="ask-buttons"><button type="button" class="ask-no">${cancel}</button><button type="button" class="ask-yes" disabled>${action}</button></div></div>`;
      const onKey = e => { if (e.key === 'Escape') done(false); };
      const done = v => { document.removeEventListener('keydown', onKey, true); el.remove(); closeAsk = null; resolve(v); };
      el.addEventListener('click', e => {
        if (e.target === el || e.target.closest('.ask-no')) done(false);
        else if (e.target.closest('.ask-yes') && !el.querySelector('.ask-yes').disabled) done(true);
      });
      document.addEventListener('keydown', onKey, true);
      closeAsk = done;
      document.body.appendChild(el);
      el.querySelector('.ask-no').focus();
      setTimeout(() => { const b = el.querySelector('.ask-yes'); if (b) b.disabled = false; }, 500);
    });
  }

  // The user has said yes. A Signal K PUT carries only the value, so it cannot
  // say "confirmed" and the plugin refuses it for these circuits; the plugin's
  // own route can. Confirmation of the result is the same as for a PUT.
  async function postConfirmedSwitch(circuit, on, previous) {
    const requested = on ? 'ON' : 'OFF';
    setPending(circuit, 'state', requested, previous);
    render();
    try {
      const r = await fetch(`${API}/circuits/${encodeURIComponent(circuit.slug)}/${on ? 'on' : 'off'}?confirm=1`, { method:'POST', credentials:'include' });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || `Command failed (HTTP ${r.status})`);
      console.debug('[CZone UI] confirmed switch accepted', circuit.name, requested);
      startPendingReconciliation(circuit, 'state');
      render();
    } catch (e) {
      rollbackPending(circuit, 'state');
      render();
      alert(e.message);
    }
  }

  window.toggleCircuit = (name, on, confirmed) => {
    if (status.sendingEnabled !== true) { alert('CZone write control is disabled. Enable “Enable CZone read/write control” in Plugin Config first.'); return; }
    const c = circuits.find(x => x.name === decodeURIComponent(name)); if (!c) return;
    const existing = pending.get(nameKey(c));
    if (existing && existing.kind === 'state') { console.debug('[CZone UI] duplicate state click ignored', c.name); return; }
    const requiresConfirm = on ? c.confirmOn : c.confirmOff;
    if (requiresConfirm && !confirmed) { askSwitch(c, on).then(ok => { if (ok) window.toggleCircuit(name, on, true); }); return; }
    c.state = c.state || {};
    const previous = c.state.state || 'OFF';
    c.state.state = on ? 'ON' : 'OFF';
    if (requiresConfirm) { postConfirmedSwitch(c, on, previous); return; }
    putSignalK(signalKPath(c, 'state'), on, c, 'state', on ? 'ON' : 'OFF', previous);
  };
  window.setLevel = (name, value, confirmed) => {
    if (status.sendingEnabled !== true) { alert('CZone write control is disabled. Enable “Enable CZone read/write control” in Plugin Config first.'); return; }
    const c = circuits.find(x => x.name === decodeURIComponent(name)); if (!c) return;
    c.state = c.state || {};
    const requested = Math.max(10, Number(value));
    const previous = Number.isFinite(c.state.percent) ? c.state.percent : 100;
    const switchesOn = c.state.state !== 'ON';
    if (switchesOn && c.confirmOn && !confirmed) {
      askSwitch(c, true).then(ok => { if (ok) window.setLevel(name, value, true); });
      return;
    }
    c.state.percent = requested;
    if (switchesOn && c.confirmOn) {
      fetch(`${API}/circuits/${encodeURIComponent(c.slug)}/level?confirm=1`, {
        method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body:JSON.stringify({percent:requested, confirm:true})
      }).then(async r => { const data=await r.json(); if(!r.ok) throw new Error(data.error || `Command failed (HTTP ${r.status})`); })
        .catch(e => { c.state.percent=previous; render(); alert(e.message); });
      return;
    }
    putSignalK(signalKPath(c, 'brightness'), requested / 100, c, 'brightness', requested, previous);
  };
  window.toggleFavorite = key => { favorites.has(key) ? favorites.delete(key) : favorites.add(key); saveFavorites(); render(); };

  // ---- Trends ---------------------------------------------------------------
  // The arrow at the end of a row opens that circuit's current over time, at
  // the top of the page. GET /trend answers with rows of [t, value] (full
  // detail) or [t, average, min, max] (ten-minute summaries, for ranges over
  // 48 h); the chart draws the average as the line and min-max as a band.
  const TREND_RANGES = [['1h','1 h'], ['24h','24 h'], ['7d','7 d'], ['31d','31 d'], ['90d','90 d'], ['1y','1 y']];
  const TREND_RANGE_MS = { '1h':3600e3, '24h':86400e3, '7d':7*86400e3, '31d':31*86400e3, '90d':90*86400e3, '1y':365*86400e3 };
  const TREND_RGB = '56,169,255';
  // How each kind of reading is shown: Signal K units in, display units out.
  // `zero`: the chart's scale starts at zero.
  const READING = {
    current: { label:'Current', unit:'A', dp:1, zero:true, f:v => v },
    voltage: { label:'Voltage', unit:'V', dp:2, f:v => v },
    power: { label:'Power', unit:'W', dp:0, zero:true, f:v => v },
    stateOfCharge: { label:'Charge', unit:'%', dp:0, zero:true, f:v => v * 100 },
    temperature: { label:'Temperature', unit:'°C', dp:1, f:v => v - 273.15 },
    relativeHumidity: { label:'Humidity', unit:'%', dp:0, zero:true, f:v => v * 100 },
    pressure: { label:'Pressure', unit:'kPa', dp:1, f:v => v / 1000 },
    currentLevel: { label:'Level', unit:'%', dp:0, zero:true, f:v => v * 100 },
    currentVolume: { label:'Volume', unit:'L', dp:0, zero:true, f:v => v * 1000 },
    capacity: { label:'Capacity', unit:'L', dp:0, f:v => v * 1000 },
    frequency: { label:'Frequency', unit:'Hz', dp:1, f:v => v }
  };
  // Atmospheric pressure (source 0) in hPa, AC volts to one decimal.
  function readingFor(item, field) {
    const r = READING[field] || { label:field, unit:'', dp:1, f:v => v };
    if (field === 'pressure' && item && item.source === 0) return Object.assign({}, r, { unit:'hPa', dp:0, f:v => v / 100 });
    if (field === 'voltage' && item && item.kind === 'ac') return Object.assign({}, r, { dp:1 });
    return r;
  }
  const trend = { open:false, series:null, range:'24h', custom:null, customOpen:false, start:0, end:0, data:[], gapMs:0, latest:null, hover:null, geom:null, timer:null, seq:0 };
  const trendEl = id => document.querySelector('#' + id);
  const trendPath = c => `electrical.czone.${c.slug}.current`;
  // datetime-local wants local time as YYYY-MM-DDTHH:MM.
  const toLocalInput = ms => { const d = new Date(ms - new Date(ms).getTimezoneOffset() * 60e3); return d.toISOString().slice(0, 16); };

  // A trend is one Signal K path: a circuit's current, or any monitored value.
  function showTrend(series) {
    trend.open = true; trend.series = series; trend.data = []; trend.hover = null;
    trendEl('trendTitle').textContent = series.title;
    trendEl('trendSub').textContent = `${series.r.label} · ${series.path}`;
    trendEl('trendPanel').classList.add('show');
    loadTrend();
    trendEl('trendPanel').scrollIntoView({ behavior:'smooth', block:'start' });
  }
  window.openTrend = slug => {
    const c = circuitBySlug(decodeURIComponent(slug)); if (!c) return;
    showTrend({ path: trendPath(c), title: c.name.trim(), r: READING.current });
  };
  window.closeTrend = () => { trend.open = false; clearInterval(trend.timer); trendEl('trendPanel').classList.remove('show'); };
  window.setTrendRange = key => {
    if (key === 'custom') { trend.customOpen = true; trendControls(); return; } // nothing reloads until Apply
    trend.customOpen = false; trend.custom = null; trend.range = key; trend.data = [];
    loadTrend();
  };
  window.applyTrendCustom = () => {
    const from = new Date(trendEl('trendFrom').value).getTime(), to = new Date(trendEl('trendTo').value).getTime();
    const msg = trendEl('trendCustomMsg');
    if (!Number.isFinite(from) || !Number.isFinite(to)) { msg.textContent = 'Enter a start and an end.'; return; }
    if (to <= from) { msg.textContent = 'The start must be before the end.'; return; }
    msg.textContent = '';
    trend.range = 'custom'; trend.custom = { from, to }; trend.data = [];
    loadTrend();
  };

  function trendControls() {
    const customOn = trend.customOpen || trend.range === 'custom';
    trendEl('trendRanges').innerHTML = TREND_RANGES.map(([k, label]) => `<button type="button" class="${!customOn && k === trend.range ? 'active' : ''}" onclick="setTrendRange('${k}')">${label}</button>`).join('') +
      `<button type="button" class="${customOn ? 'active' : ''}" onclick="setTrendRange('custom')">Custom</button>`;
    trendEl('trendCustom').classList.toggle('show', customOn);
  }
  function trendMsg(text) { const m = trendEl('trendMsg'); m.textContent = text; m.classList.toggle('show', !!text); }

  async function loadTrend() {
    if (!trend.open || !trend.series) return;
    trendControls();
    const seq = ++trend.seq;
    if (!trend.data.length) { trendMsg('Loading…'); trendStats(); drawTrend(); }
    const custom = trend.range === 'custom' && trend.custom;
    const query = custom ? `from=${trend.custom.from}&to=${trend.custom.to}` : `range=${trend.range}`;
    let res;
    try {
      const r = await fetch(`${API}/trend?path=${encodeURIComponent(trend.series.path)}&${query}`, { cache:'no-store', credentials:'include' });
      res = await r.json();
    } catch (e) { res = { available:false, detail:e.message }; }
    if (seq !== trend.seq || !trend.open) return;
    // Kept as [t, value, min, max]; min and max are null for full detail.
    // Converted to display units here, so the chart and figures need not know.
    const f = trend.series.r.f, fx = v => (v === null || v === undefined ? null : f(v));
    trend.data = (Array.isArray(res.data) ? res.data : []).map(p => [p[0], f(p[1]), p.length > 2 ? fx(p[2]) : null, p.length > 3 ? fx(p[3]) : null]);
    trend.gapMs = Number(res.gapMs) || 16 * 60e3;
    trend.latest = res.latest && Number.isFinite(res.latest.value) ? f(res.latest.value) : null;
    const now = Date.now();
    trend.end = Number(res.end) || (custom ? trend.custom.to : now);
    trend.start = Number(res.start) || (custom ? trend.custom.from : now - (TREND_RANGE_MS[trend.range] || TREND_RANGE_MS['24h']));
    if (!trend.customOpen || trend.range !== 'custom') { trendEl('trendFrom').value = toLocalInput(trend.start); trendEl('trendTo').value = toLocalInput(trend.end); }
    trend.hover = null;
    trendEl('trendTip').style.display = 'none';
    if (res.available === false || res.error) trendMsg(res.detail || 'Trends are not available.');
    else if (!trend.data.length) trendMsg(custom ? 'Nothing was recorded in this period.' : 'No samples in this range yet.');
    else trendMsg('');
    trendControls(); trendStats(); drawTrend();
    clearInterval(trend.timer);
    if (trend.range === '1h' || trend.range === '24h') trend.timer = setInterval(() => { if (trend.open) loadTrend(); }, 60000);
  }

  const trendLow = p => p[2] === null ? p[1] : p[2];
  const trendHigh = p => p[3] === null ? p[1] : p[3];

  function trendStats() {
    const d = trend.data, el = trendEl('trendStats');
    if (!d.length) { el.innerHTML = ''; return; }
    // Samples are stored on change, so they are not evenly spaced: the average
    // is taken over time (and not across gaps), not over the number of rows.
    let area = 0, span = 0;
    for (let i = 1; i < d.length; i++) {
      const dt = d[i][0] - d[i - 1][0];
      if (dt > trend.gapMs) continue;
      area += dt * (d[i][1] + d[i - 1][1]) / 2; span += dt;
    }
    const avg = span ? area / span : d.reduce((sum, p) => sum + p[1], 0) / d.length;
    const u = trend.series.r;
    const tile = (icon, label, v) => `<div class="stat"><div class="stat-icon">${icon}</div><div><strong>${v.toFixed(u.dp)} ${u.unit}</strong><span>${label}</span></div></div>`;
    // "Now" is the live value. The last row of a long range is an average, and
    // a past period or a circuit that is not reporting has no "now".
    const first = trend.latest !== null && trend.range !== 'custom' ? tile('●', 'Now', trend.latest) : tile('●', 'Last', d[d.length - 1][1]);
    el.innerHTML = first + tile('↓', 'Minimum', Math.min(...d.map(trendLow))) + tile('≈', 'Average', avg) + tile('↑', 'Maximum', Math.max(...d.map(trendHigh)));
  }

  function trendTicks(min, max, count) {
    if (min === max) { const pad = Math.abs(min) * 0.05 || 1; min -= pad; max += pad; }
    const raw = (max - min) / count;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || raw;
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
    for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v / step) * step);
    return { lo, hi, ticks, step };
  }
  function trendTimeLabel(t, span) {
    const d = new Date(t), hm = d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    if (span <= 36 * 3600e3) return hm;
    if (span <= 10 * 86400e3) return d.toLocaleDateString([], { weekday:'short' }) + ' ' + hm;
    if (span <= 200 * 86400e3) return d.toLocaleDateString([], { day:'numeric', month:'short' });
    return d.toLocaleDateString([], { month:'short', year:'2-digit' });
  }

  function drawTrend() {
    const canvas = trendEl('trendCanvas');
    trend.geom = null;
    const dpr = window.devicePixelRatio || 1, W = canvas.clientWidth, H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const d = trend.data;
    if (!d.length || !W) return;
    ctx.font = '11px Inter, system-ui, sans-serif';

    // Current, power and levels are shown from zero; the scale covers the min-max band.
    const lows = d.map(trendLow);
    const y = trendTicks(trend.series.r.zero ? Math.min(0, ...lows) : Math.min(...lows), Math.max(...d.map(trendHigh)), 5);
    let dp = Math.max(0, -Math.floor(Math.log10(y.step) + 1e-9));
    if (y.ticks.some(t => Math.abs(t * Math.pow(10, dp) - Math.round(t * Math.pow(10, dp))) > 1e-6)) dp++;
    const pad = { l: Math.max(...y.ticks.map(t => ctx.measureText(t.toFixed(dp)).width), ctx.measureText(trend.series.r.unit).width) + 14, r:12, t:12, b:26 };
    const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b, t0 = trend.start, t1 = trend.end, base = pad.t + ph;
    const X = t => pad.l + ((t - t0) / (t1 - t0)) * pw;
    const Y = v => pad.t + (1 - (v - y.lo) / (y.hi - y.lo)) * ph;

    // Grid and labels, kept quiet.
    ctx.strokeStyle = 'rgba(148,193,235,.10)'; ctx.lineWidth = 1; ctx.fillStyle = '#8fa7be';
    ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
    for (const t of y.ticks) {
      const yy = Math.round(Y(t)) + 0.5;
      ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(W - pad.r, yy); ctx.stroke();
      ctx.fillText(t.toFixed(dp), pad.l - 8, yy);
    }
    ctx.textBaseline = 'top';
    const n = Math.max(2, Math.min(7, Math.floor(pw / 110)));
    for (let i = 0; i <= n; i++) {
      const t = t0 + (i / n) * (t1 - t0);
      ctx.textAlign = i === 0 ? 'left' : i === n ? 'right' : 'center';
      ctx.fillText(trendTimeLabel(t, t1 - t0), X(t), H - pad.b + 8);
    }

    // The line breaks where samples are missing (plugin stopped, card out,
    // module off the bus).
    const segments = [];
    let seg = [d[0]];
    for (let i = 1; i < d.length; i++) {
      if (d[i][0] - d[i - 1][0] > trend.gapMs) { segments.push(seg); seg = []; }
      seg.push(d[i]);
    }
    segments.push(seg);
    const color = `rgb(${TREND_RGB})`;
    ctx.save();
    ctx.beginPath(); ctx.rect(pad.l, 0, pw, H); ctx.clip();
    for (const g of segments) {
      if (g.length === 1) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(g[0][0]), Y(g[0][1]), 2.5, 0, Math.PI * 2); ctx.fill(); continue; }
      ctx.beginPath();
      if (g.some(p => p[2] !== null && p[3] !== p[2])) {
        // Summarised data: the min-max band behind the average.
        g.forEach((p, i) => i ? ctx.lineTo(X(p[0]), Y(trendHigh(p))) : ctx.moveTo(X(p[0]), Y(trendHigh(p))));
        for (let i = g.length - 1; i >= 0; i--) ctx.lineTo(X(g[i][0]), Y(trendLow(g[i])));
        ctx.fillStyle = `rgba(${TREND_RGB},.20)`;
      } else {
        g.forEach((p, i) => i ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])));
        ctx.lineTo(X(g[g.length - 1][0]), base); ctx.lineTo(X(g[0][0]), base);
        const grad = ctx.createLinearGradient(0, pad.t, 0, base);
        grad.addColorStop(0, `rgba(${TREND_RGB},.22)`); grad.addColorStop(1, `rgba(${TREND_RGB},0)`);
        ctx.fillStyle = grad;
      }
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      g.forEach((p, i) => i ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])));
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
    }
    ctx.restore();

    trend.geom = { X, Y, pad, pw, W, t0, t1 };
    if (trend.hover) {
      const p = trend.hover, x = Math.round(X(p[0])) + 0.5;
      ctx.strokeStyle = 'rgba(237,246,255,.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, base); ctx.stroke();
      ctx.fillStyle = color; ctx.strokeStyle = '#0b1a2b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(X(p[0]), Y(p[1]), 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  }

  // The crosshair snaps to the nearest sample.
  function trendHover(px) {
    const tip = trendEl('trendTip'), g = trend.geom, d = trend.data;
    if (!g || !d.length) { tip.style.display = 'none'; return; }
    const t = g.t0 + ((px - g.pad.l) / g.pw) * (g.t1 - g.t0);
    let lo = 0, hi = d.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (d[mid][0] < t) lo = mid; else hi = mid; }
    const p = Math.abs(d[lo][0] - t) <= Math.abs(d[hi][0] - t) ? d[lo] : d[hi];
    trend.hover = p;
    drawTrend();
    const when = new Date(p[0]).toLocaleString([], Object.assign({ weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }, g.t1 - g.t0 > 300 * 86400e3 ? { year:'numeric' } : {}));
    const u = trend.series.r;
    const spread = p[2] !== null && p[3] !== p[2] ? `<small>min ${p[2].toFixed(u.dp)} · max ${p[3].toFixed(u.dp)}</small>` : '';
    tip.innerHTML = `<b>${p[1].toFixed(u.dp)} ${u.unit}</b>${spread}<small>${esc(when)}</small>`;
    tip.style.display = 'block';
    const x = trend.geom.X(p[0]), tw = tip.offsetWidth;
    tip.style.left = `${Math.max(8, x + 14 + tw > g.W - 8 ? x - 14 - tw : x + 14) + 12}px`;
    tip.style.top = `${Math.max(12, trend.geom.Y(p[1]) - 20)}px`;
  }
  function trendHoverEnd() { trend.hover = null; drawTrend(); trendEl('trendTip').style.display = 'none'; }
  trendEl('trendCanvas').addEventListener('mousemove', e => trendHover(e.offsetX));
  trendEl('trendCanvas').addEventListener('mouseleave', trendHoverEnd);
  trendEl('trendCanvas').addEventListener('touchmove', e => { const r = e.currentTarget.getBoundingClientRect(); trendHover(e.touches[0].clientX - r.left); }, { passive:true });
  trendEl('trendCustom').addEventListener('keydown', e => { if (e.key === 'Enter') window.applyTrendCustom(); });
  // Escape closes the trend, unless a dialog is open on top of it. Listening in
  // the capture phase sees the dialog before the dialog's own handler removes it.
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && trend.open && !document.querySelector('[role="alertdialog"]')) window.closeTrend(); }, true);
  window.addEventListener('resize', () => { if (trend.open) drawTrend(); });

  function renderModes() {
    const el = document.querySelector('#modes');
    if (!el) return;
    if (el.parentElement) el.parentElement.classList.toggle('none', !modes.length); // hidden on a plotter when there are none
    if (!modes.length) { el.innerHTML = '<div class="empty" style="padding:10px 4px">No CZone modes found.</div>'; return; }
    el.innerHTML = modes.map(m => {
      const active = activeMode && activeMode.slug === m.slug;
      const pending = modePending && modePending.slug === m.slug;
      return `<button type="button" class="mode-button ${active?'active':''} ${modePending?'pending':''}" ${modePending?'disabled':''} onclick="activateMode('${encodeURIComponent(m.slug)}')" aria-busy="${pending?'true':'false'}"><div class="mode-name"><span>${esc(m.name === 'Day Crusing' ? 'Day Cruising' : m.name)}</span><span>${pending?'Sending…':active?'ACTIVE':' '}</span></div><div class="mode-state">${active?'Current operating mode':'Select mode'}</div></button>`;
    }).join('');
  }

  window.activateMode = function (slug) {
    if (status.sendingEnabled !== true) { alert('CZone write control is disabled. Enable “Enable CZone read/write control” in Plugin Config first.'); return; }
    const decoded = decodeURIComponent(slug);
    const mode = modes.find(m => m.slug === decoded);
    if (!mode || modePending) return;
    const previous = activeMode;
    activeMode = mode;
    modePending = { slug: mode.slug, previous: previous };
    renderModes();
    fetch(`${API}/modes/${encodeURIComponent(mode.slug)}/activate`, { method:'POST', credentials:'include' })
      .then(async r => { const data = await r.json(); if (!r.ok) throw new Error(data.error || 'Mode command failed'); })
      .catch(err => { activeMode = previous; modePending = null; renderModes(); alert(err.message); });
  };

  function renderHero() {
    const name = (vesselName || '').trim();
    document.querySelector('#heroTitle').textContent = name ? `${name}’s Circuits` : 'Your Boat, Your Circuits';
    const gate = document.querySelector('#writeGate');
    if (gate) {
      const enabled = status.sendingEnabled === true;
      gate.style.display = enabled ? 'none' : 'block';
      gate.textContent = enabled ? '' : 'CZone write control is disabled — enable “Enable CZone read/write control” in Plugin Config to use the CZone control interface.';
    }
  }

  function renderStats() {
    const on=activeCount(), total=circuits.length, fav=circuits.filter(c=>favorites.has(nameKey(c))).length;
    document.querySelector('#stats').innerHTML = `<div class="stat"><div class="stat-icon">⚡</div><div><strong>${total}</strong><span>Total Circuits</span></div></div><div class="stat"><div class="stat-icon">●</div><div><strong>${on}</strong><span>In Use</span></div></div><div class="stat"><div class="stat-icon">○</div><div><strong>${total-on}</strong><span>Off</span></div></div><div class="stat"><div class="stat-icon">★</div><div><strong>${fav}</strong><span>Favorites</span></div></div>`;
    const n2kReady = status.nmeaReady === true;
    const readyColor = n2kReady ? '#64e4aa' : '#ffcc77';
    const readyText = n2kReady ? 'NMEA 2000 output ready' : 'NMEA 2000 output waiting';
    const lastOut = status.lastNmeaOutput ? `<br><span style="color:#7f97ad">Last command: ${esc(status.lastNmeaOutput.circuit)} · ${esc(status.lastNmeaOutput.description)}</span>` : '';
    document.querySelector('#connectionCard').innerHTML = `<div style="color:#a9bfd2;font-size:12px;line-height:1.7"><span style="color:${status.sendingEnabled?'#64e4aa':'#ffcc77'}">● NMEA 2000 sending ${status.sendingEnabled?'enabled':'disabled'}</span><br><span style="color:${readyColor}">● ${readyText}</span>${lastOut}</div>`;
  }

  // Scrolling on a chartplotter. Its touch arrives as mouse events, so a
  // drag would select text and nothing would scroll. So a press that moves
  // more than a few pixels scrolls the nearest scrolling box (the list or the
  // left column). Positions are applied once per frame, and the tap that ends
  // a drag is not passed on as a click.
  // The plotter is slow, so redraws caused by live data wait while a finger is
  // down (see liveRender).
  let mfdBusyUntil = 0; // no data-driven redraw before this time
  if (MFD) {
    let drag = null, swallow = false, frame = 0;
    const scrollerOf = el => {
      for (let n = el; n && n !== document.body && n !== document.documentElement; n = n.parentElement) {
        const oy = getComputedStyle(n).overflowY;
        if ((oy === 'auto' || oy === 'scroll') && n.scrollHeight > n.clientHeight + 1) return n;
      }
      return document.scrollingElement || document.documentElement;
    };
    const applyDrag = () => { frame = 0; if (drag && drag.moved) drag.box.scrollTop = drag.want; };
    document.addEventListener('mousedown', e => {
      if (e.button !== 0 || (e.target.closest && e.target.closest('input, select, canvas, .ask'))) return;
      const box = scrollerOf(e.target);
      drag = { box, y: e.clientY, top: box.scrollTop, want: box.scrollTop, moved: false, held: false };
      mfdBusyUntil = Date.now() + 1500;
    }, true);
    document.addEventListener('mousemove', e => {
      if (!drag) return;
      // Released outside the page. Only trusted once this drag has reported a
      // held button, since some touch layers never report one.
      if (e.buttons) drag.held = true; else if (drag.held) { endDrag(); return; }
      const dy = e.clientY - drag.y;
      if (!drag.moved && Math.abs(dy) < 10) return;
      drag.moved = true;
      drag.want = drag.top - dy;
      mfdBusyUntil = Date.now() + 1500;
      if (!frame) frame = requestAnimationFrame(applyDrag);
      e.preventDefault();
    }, true);
    function endDrag() {
      if (drag && drag.moved) { applyDrag(); swallow = true; setTimeout(() => { swallow = false; }, 80); }
      drag = null;
      mfdBusyUntil = Date.now() + 400;
    }
    document.addEventListener('mouseup', endDrag, true);
    window.addEventListener('blur', endDrag);
    document.addEventListener('click', e => { if (swallow) { e.stopPropagation(); e.preventDefault(); swallow = false; } }, true);
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('selectstart', e => { if (!(e.target.closest && e.target.closest('input'))) e.preventDefault(); });

    // A newer page. The plotter keeps showing the page it first loaded, even
    // after the tile is closed and reopened, so an update never appeared
    // without restarting the plotter. Once a minute the page fetches itself
    // and, if its own script has changed on the server, reloads. One attempt
    // per version, so a plotter that will not let go cannot loop.
    const checkPage = async () => {
      try {
        if (!OWN_SCRIPT) return;
        const r = await fetch(location.pathname + '?fresh=' + Date.now(), { cache: 'no-store', credentials: 'include' });
        if (!r.ok) return;
        const text = await r.text();
        const found = text.split('<scr' + 'ipt>').map(part => part.split('</scr' + 'ipt>')[0]).find(part => part.indexOf("const API = '/plugins/signalk-czone'") >= 0);
        if (!found || found === OWN_SCRIPT) return;
        const tried = String(found.length) + ':' + found.slice(-200).length + ':' + found.split('\n').length;
        let before = null;
        try { before = sessionStorage.getItem('czone-reload'); sessionStorage.setItem('czone-reload', tried); } catch (_) { return; }
        if (before !== tried) location.reload(true);
      } catch (_) {}
    };
    setTimeout(checkPage, 15000);
    setInterval(checkPage, 60000);

    // What the plotter actually sends: five taps on the connection line show
    // the last input events and how long frames and redraws take. For
    // diagnosing a plotter we cannot connect a debugger to.
    let taps = [], probe = null;
    document.querySelector('#connection').addEventListener('click', () => {
      const now = Date.now();
      taps = taps.filter(t => now - t < 3000).concat(now);
      if (taps.length < 5) return;
      taps = [];
      if (probe) { probe.remove(); probe = null; return; }
      probe = document.createElement('pre');
      probe.className = 'mfd-probe';
      document.body.appendChild(probe);
      const log = [];
      let last = performance.now(), frames = [];
      const note = e => {
        const t = performance.now();
        log.push(`${String(Math.round(t - last)).padStart(5)} ms  ${e.type.padEnd(11)} b=${e.buttons === undefined ? '-' : e.buttons} ${e.pointerType || ''} ${e.touches ? 't' + e.touches.length : ''} ${e.deltaY !== undefined ? 'dy=' + Math.round(e.deltaY) : ''}`);
        last = t;
        if (log.length > 16) log.shift();
      };
      for (const type of ['mousedown', 'mousemove', 'mouseup', 'click', 'touchstart', 'touchmove', 'touchend', 'pointerdown', 'pointermove', 'pointerup', 'wheel', 'scroll']) document.addEventListener(type, note, true);
      // Frame time: the gap between two frames in a row. Redraw: rebuilding the list.
      const tick = () => {
        if (!probe) return;
        requestAnimationFrame(t1 => requestAnimationFrame(t2 => {
          if (!probe) return;
          frames.push(t2 - t1);
          if (frames.length > 10) frames.shift();
          const t0 = performance.now(); renderCircuits(); const redraw = performance.now() - t0;
          probe.textContent = `${window.innerWidth}x${window.innerHeight}  frame ${Math.round(frames.reduce((a, b) => a + b, 0) / frames.length)} ms  redraw ${Math.round(redraw)} ms\n${navigator.userAgent.replace(/^.*(Chrome\/[\d.]+).*$/, '$1')}\n` + log.join('\n');
          setTimeout(tick, 700);
        }));
      };
      tick();
    });
  }
  // A redraw asked for by live data. Anywhere else it runs at once. On a
  // plotter it waits until no finger is down, and runs at most twice a second.
  let liveTimer = null, liveLast = 0;
  function liveRender() {
    if (!MFD) { render(); return; }
    if (liveTimer) return;
    const run = () => {
      const now = Date.now();
      const wait = Math.max(mfdBusyUntil - now, liveLast + 500 - now);
      if (wait > 0) { liveTimer = setTimeout(run, wait); return; }
      liveTimer = null; liveLast = now; render();
    };
    run();
  }

  function render() { renderNav(); renderCategories(); renderCircuits(); renderStats(); renderModes(); renderHero(); }

  document.querySelector('#search').addEventListener('input', e => { query=e.target.value.trim(); view=query?'search':'all'; category=null; render(); });
  document.querySelector('#sort').addEventListener('change', e => { sort=e.target.value; renderCircuits(); });

  function updateSocketIndicator(text, ok) {
    const el = document.querySelector('#connection');
    el.classList.toggle('ok', !!ok);
    el.innerHTML = `<i></i><span>${text}</span>`;
  }

  function sendSubscriptions() {
    if (!socket || socket.readyState !== WebSocket.OPEN || !circuits.length) return;
    const subscribe = [{ path: 'name', policy: 'instant' }, { path: 'electrical.czone.mode.active', policy: 'instant' }, { path: 'electrical.czone.settingsRevision', policy: 'instant' }];
    for (const c of circuits) {
      subscribe.push({ path: `electrical.czone.${c.slug}.switch.state`, policy: 'instant' });
      subscribe.push({ path: `electrical.czone.${c.slug}.current`, policy: 'instant' });
      if (c.capabilities && c.capabilities.dimmer) subscribe.push({ path: `electrical.czone.${c.slug}.switch.brightness`, policy: 'instant' });
    }
    console.debug('[CZone WS] subscribing to', subscribe.length, 'exact circuit paths');
    socket.send(JSON.stringify({ context:'vessels.self', subscribe }));
  }

  function scheduleWatchdog() {
    clearTimeout(watchdogTimer);
    const elapsed = lastSocketUpdateAt ? Date.now() - lastSocketUpdateAt : WS_WATCHDOG_MS;
    const wait = Math.max(1000, WS_WATCHDOG_MS - elapsed);
    watchdogTimer = setTimeout(async () => {
      if (!lastSocketUpdateAt || Date.now() - lastSocketUpdateAt >= WS_WATCHDOG_MS) {
        console.debug('[CZone WS] 120s watchdog fired; REST reconciliation');
        await refreshOnce('websocket-watchdog');
        lastSocketUpdateAt = Date.now();
      }
      scheduleWatchdog();
    }, wait);
  }

  function connectSocket() {
    if (!('WebSocket' in window)) { console.warn('[CZone WS] WebSocket unavailable'); return; }
    if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
    try {
      console.debug('[CZone WS] connecting', SK);
      socket = new WebSocket(SK);
      socket.onopen = () => {
        socketConnected = true;
        socketEverOpen = true;
        lastSocketUpdateAt = Date.now();
        updateSocketIndicator('Connected · WebSocket live', true);
        sendSubscriptions();
        scheduleWatchdog();
      };
      socket.onmessage = ev => {
        try {
          const msg = JSON.parse(ev.data);
          if (!msg.updates) return;
          lastSocketUpdateAt = Date.now();
          let changed = false;
          let valuesSeen = 0;
          let circuitValues = 0;
          for (const update of msg.updates) {
            for (const v of (update.values || [])) {
              valuesSeen++;
              if (/^electrical\.czone\./.test(v.path || '')) circuitValues++;
              if (applySocketValue(v.path, v.value, update.source, update.timestamp)) changed = true;
            }
          }
          console.debug('[CZone WS] delta received', { valuesSeen, circuitValues, changed, updateSource: msg.updates.map(u => u.source || null), updateTimestamp: msg.updates.map(u => u.timestamp || null), timestamp: new Date(lastSocketUpdateAt).toISOString() });
          updateSocketIndicator(circuitValues ? 'Connected · CZone updates live' : 'Connected · WebSocket live', true);
          scheduleWatchdog();
          if (changed) liveRender();
        } catch (e) { console.debug('[CZone WS] message parse error', e); }
      };
      socket.onclose = () => {
        socketConnected = false;
        updateSocketIndicator(socketEverOpen ? 'Live updates lost · reconnecting…' : 'Connecting live updates…', false);
        console.warn('[CZone WS] closed; reconnecting');
        clearTimeout(socketReconnectTimer);
        socketReconnectTimer = setTimeout(connectSocket, 3000);
        lastSocketUpdateAt = 0;
        scheduleWatchdog();
      };
      socket.onerror = e => { console.warn('[CZone WS] error', e); try { socket.close(); } catch (_) {} };
    } catch (e) { console.warn('[CZone WS] connect failed', e); }
  }

  refreshVesselName();
  refreshOnce('initial-load').then(loaded => {
    if (!loaded) return;
    refreshMonitoring();
    setInterval(refreshMonitoring, 5000);
    if (circuits.length) {
      connectSocket();
      sendSubscriptions();
    } else if (status.sendingEnabled === true) {
      updateSocketIndicator('CZone circuits not loaded', false);
    } else {
      updateSocketIndicator('CZone control disabled · no control WebSocket', false);
      render();
    }
  });

})();
</script>
</body>
</html>
